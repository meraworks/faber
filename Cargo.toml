[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
glam = "0.33"
earcutr = "0.5"
tempfile = "3"
jrsonnet-evaluator = { version = "0.5.0-pre98", default-features = false, features = ["ir-parser", "explaining-traces"] }
jrsonnet-stdlib = "0.5.0-pre98"

[patch.crates-io]
# See vendor/jrsonnet-stdlib/Cargo.toml.
jrsonnet-stdlib = { path = "vendor/jrsonnet-stdlib" }

# Full debug data for about 100 test programs filled the disk (115 GB of PDB files).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.faber-scene]
opt-level = 3

[profile.dev.package.faber-sim]
opt-level = 3

[profile.dev.package.faber-render]
opt-level = 3

[package]
name = "faber"
version = "0.3.0"
edition = "2024"

[dependencies]
faber-sketch = { path = "crates/faber-sketch" }
faber-clash = { path = "crates/faber-clash" }
faber-core = { path = "crates/faber-core" }
faber-files = { path = "crates/faber-files" }
faber-model = { path = "crates/faber-model" }
faber-ports = { path = "crates/faber-ports" }
faber-scene = { path = "crates/faber-scene" }
faber-std = { path = "crates/faber-std" }
faber-wiring = { path = "crates/faber-wiring" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64 = "0.23"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
tokio = { version = "1.54", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
