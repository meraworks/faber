[package]
name = "faber-clash"
description = "Interference and clearance checks for Faber assemblies"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
parry3d-f64 = "0.31.1"
glamx = "0.3.1"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
