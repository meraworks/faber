[package]
name = "faber-viewer"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
faber-form = { path = "../faber-form" }
faber-sketch = { path = "../faber-sketch" }
rfd = "0.17.2"
faber-expr = { path = "../faber-expr" }
faber-model = { path = "../faber-model" }
faber-std = { path = "../faber-std" }
faber-core = { path = "../faber-core" }
faber-ports = { path = "../faber-ports" }
faber-print = { path = "../faber-print" }
faber-scene = { path = "../faber-scene" }
faber-render = { path = "../faber-render" }
faber-wiring = { path = "../faber-wiring" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
glam.workspace = true
serde_json.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
